syntax            = "proto3";
option go_package = "github.com/csuJudge/javaProto/javaSolution";

package oj.java.solution;

service SolutionServer {
  // QueryRuntimeInfo 查询信息
  rpc QueryRuntimeInfo(QueryRuntimeInfoReq) returns (QueryRuntimeInfoRsp) {}
  // QuerySourceCode 查询源代码
  rpc QuerySourceCode(QuerySourceCodeReq) returns (QuerySourceCodeRsp) {}
  // QueryLatestCode 查询最新的代码
  rpc QueryLatestCode(QueryLatestCodeReq) returns (QuerySourceCodeRsp) {}
  // AddSolution 添加提交数据
  rpc AddSolution(AddSolutionReq) returns (AddSolutionRsp) {}
  // QuerySolution 查询提交数据
  rpc QuerySolution(QuerySolutionReq) returns (QuerySolutionRsp) {}
  // QueryResult 查询结果
  rpc QueryResult(QueryRuntimeInfoReq) returns (QueryResultRsp) {}
  // QueryUserProblemSolutionStatus 查询用户的题目提交状态
  rpc QueryUserProblemSolutionStatus(QueryUserProblemSolutionStatusReq)returns(QueryUserProblemSolutionStatusRsp){}
}

message QueryUserProblemSolutionStatusRsp{
  string message = 1;  // 返回信息
  int32 code = 2;  // 返回码
  repeated ProblemSolutionStatus results = 3; // 结果
}

message ProblemSolutionStatus{
  int32 problemID = 1; // 题目编号
  int32 result = 2; // 结果
}

message QueryUserProblemSolutionStatusReq{
  int32 userID = 1; // 用户编号
  string problemIDs = 2; // 题目编号
}

message QueryLatestCodeReq{
  int32 userID  = 1; // 用户编号
  int32 problemID = 2; // 题目编号
}

message QueryResultRsp{
  string message = 1;  // 返回信息
  int32 code = 2;  // 返回码
  int32 result = 3; // 结果
  int32 point = 4; // 得分
}

message QuerySolutionReq{
  int32 userID = 1; // 用户编号
  int32 page = 2; // 页
  int32 limit = 3; // 页大小
  int32 problemID = 4; // 题目编号
}

message QuerySolutionRsp{
  string message = 1;  // 返回信息
  int32 code = 2;  // 返回码
  int32 total = 3; // 总数
  repeated solution solution = 4; // 提交数据
}

message QuerySourceCodeReq{
  int32 solutionID = 1; // 提交编号
  int32 userID = 2; // 用户编号
}

message QuerySourceCodeRsp{
  string message = 1;  // 返回信息
  int32 code = 2;  // 返回码
  string sourceCode = 3; // 源码
}

message QueryRuntimeInfoReq{
  int32 solutionID = 1; // 提交编号
  int32 userID = 2; // 用户编号
}

message QueryRuntimeInfoRsp{
  string message = 1;  // 返回信息
  int32 code = 2;  // 返回码
  int32 result = 3; // 结果
  repeated runtimeInfo runtimeInfo = 4;  // 运行信息
  compileInfo compileInfo = 5;  //  编译信息
  repeated judgeDetail detail = 6; // 判题细节
}

message judgeDetail{
    int32 checkType = 1; // 检查类型
    string checkID = 2; // OOP特性名, 如 inheritance / thread
    int32 caseID = 3; // 用例编号
    string checkName = 4; // 展示名, 如 "使用了继承
    int32 passed = 5; // 是否通过
    int32 points = 6; // 该项分值
    int32 earned = 7; // 实际得分
    string reason = 8; // 判据/证据(特性项: AST 证据; 用例: 留空, 证据在 runtime_info)
}

message AddSolutionReq{
  int32 problemID = 1;   // 题目编号
  int32 userID = 2;   // 用户编号
  int32 contestID = 3;   // 考试编号
  string userCode = 4;   // 用户代码
  int32 projectID = 5; // 项目编号
}

message AddSolutionRsp{
  string message = 1;  // 返回信息
  int32 code = 2;  // 返回码
  int32 solutionID = 3;  // 提交编
}

message solution {
  int32 solutionID = 1; // 提交编号
  int32 projectID = 2; // 项目编号
  int32 problemID = 3; // 题目编号
  int32 status = 4; // 状态
  int32 result = 5; // 结果
  int32 score = 6; // 得分
  string createdTime = 7; // 提交时间
  string finishTime = 8; // 完成时间
  string problemName = 9; // 题目名称
  string userName = 10;// 提交人姓名
  int32 userID = 11; // 创建人主键
  int32 timeCost = 12; // 时间开销
  int32 memoryCost = 13; // 内存开销
}

message compileInfo {
  string log = 2; // 完整输出
  int32 status = 1; // 编译状态
  int32 duration =3;// 耗时
}

message runtimeInfo{
  int32 problemCaseID = 1;// 样例编号
  int32 status = 2; // 编译状态
  string output = 3; // 运行输出
  string errorOutput =4; // 错误输出
  int32 exitCode = 5;// 进程退出码
  int32 time = 6; // 运行耗时
  int32 memory = 7; // 峰值内存
}
